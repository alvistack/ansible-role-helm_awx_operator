# Release name to manage.
helm_awx_operator_helm_release_name: awx-operator

# Kubernetes namespace where the chart should be installed.
helm_awx_operator_helm_release_namespace: awx-operator

# Value to pass to chart.
helm_awx_operator_helm_release_values:
  AWX:
    enabled: true
    name: awx
    spec:
      admin_user: admin
      service_type: ClusterIP
      ingress_type: ingress
      ingress_hosts:
        - hostname: "{{ inventory_hostname }}"
      ingress_path: /
      ingress_path_type: ImplementationSpecific
      image: quay.io/ansible/awx
      image_version: 24.6.1
      image_pull_policy: IfNotPresent
      redis_image: docker.io/library/redis
      redis_image_version: 8.6.3
      control_plane_ee_image: quay.io/ansible/awx-ee:24.6.1
      init_container_image: quay.io/ansible/awx-ee
      init_container_image_version: 24.6.1
      init_projects_container_image: quay.io/centos/centos:stream9
      postgres_image: quay.io/sclorg/postgresql-15-c9s
      postgres_image_version: c9s
      postgres_data_volume_init: true
      postgres_init_container_commands: |
        chown 26:0 /var/lib/pgsql/data
        chmod 700 /var/lib/pgsql/data
      projects_persistence: true
      task_resource_requirements:
        requests:
          cpu: 50m
          memory: 64Mi
      web_resource_requirements:
        requests:
          cpu: 50m
          memory: 64Mi
      ee_resource_requirements:
        requests:
          cpu: 50m
          memory: 32Mi
      redis_resource_requirements:
        requests:
          cpu: 10m
          memory: 32Mi
      postgres_resource_requirements:
        requests:
          cpu: 10m
          memory: 32Mi
      rsyslog_resource_requirements:
        requests:
          cpu: 50m
          memory: 64Mi
      init_container_resource_requirements:
        requests:
          cpu: 50m
          memory: 64Mi
    postgres:
      enabled: false
  rbac:
    create: true
  operator-controller:
    spec:
      replicas: 1
  operator-controller-containers:
    kube-rbac-proxy:
      image: quay.io/brancz/kube-rbac-proxy:v0.15.0
      imagePullPolicy: IfNotPresent
    awx-manager:
      image: quay.io/ansible/awx-operator:2.19.1
      imagePullPolicy: IfNotPresent
